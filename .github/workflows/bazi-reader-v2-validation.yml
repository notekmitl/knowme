name: BaZi Reader V2 validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Test backend
        env:
          PYTHONPATH: backend
        run: python -m pytest -q backend/tests

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.1
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Install full-suite PDF dependency
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils

      - name: Format changed Dart scope
        run: >-
          dart format
          lib/data/models/bazi_chart_model.dart
          lib/features/astrology/application/astrology_generation_coordinator.dart
          lib/features/astrology/application/birth_profile_readiness.dart
          lib/features/bazi_compatibility/application/bazi_compatibility_owner_fixtures.dart
          lib/features/bazi_compatibility/application/bazi_compatibility_pdf_exporter.dart
          lib/features/bazi_compatibility/application/bazi_compatibility_report_builder.dart
          lib/features/bazi_compatibility/application/bazi_input_fingerprint.dart
          lib/features/bazi_compatibility/application/bazi_reader_v2.dart
          lib/presentation/pages/bazi/bazi_result_page.dart
          lib/presentation/providers/bazi_provider.dart
          lib/services/bazi_api_service.dart
          test/astrology_generation_coordinator_test.dart
          test/bazi_chart_model_test.dart
          test/bazi_compatibility_api_auth_test.dart
          test/bazi_compatibility_pdf_test.dart
          test/bazi_compatibility_report_test.dart
          test/bazi_provider_test.dart
          test/bazi_result_page_test.dart

      - name: Save formatter patch
        run: git diff --binary > /tmp/bazi-reader-v2-format.patch

      - uses: actions/upload-artifact@v4
        with:
          name: bazi-reader-v2-format-patch
          path: /tmp/bazi-reader-v2-format.patch

      - name: Analyze changed Dart scope
        run: >-
          flutter analyze --no-pub
          lib/data/models/bazi_chart_model.dart
          lib/features/astrology/application/astrology_generation_coordinator.dart
          lib/features/astrology/application/birth_profile_readiness.dart
          lib/features/bazi_compatibility/application/bazi_compatibility_owner_fixtures.dart
          lib/features/bazi_compatibility/application/bazi_compatibility_pdf_exporter.dart
          lib/features/bazi_compatibility/application/bazi_compatibility_report_builder.dart
          lib/features/bazi_compatibility/application/bazi_input_fingerprint.dart
          lib/features/bazi_compatibility/application/bazi_reader_v2.dart
          lib/presentation/pages/bazi/bazi_result_page.dart
          lib/presentation/providers/bazi_provider.dart
          lib/services/bazi_api_service.dart
          test/astrology_generation_coordinator_test.dart
          test/bazi_chart_model_test.dart
          test/bazi_compatibility_api_auth_test.dart
          test/bazi_compatibility_pdf_test.dart
          test/bazi_compatibility_report_test.dart
          test/bazi_provider_test.dart
          test/bazi_result_page_test.dart

      - name: Test focused Flutter scope and create Reader V2 PDF
        env:
          CI: 'true'
          FLUTTER_SUPPRESS_ANALYTICS: 'true'
          TZ: Asia/Bangkok
          BAZI_OWNER_PDF_DIRECTORY: build/bazi-reader-v2-pdf
        run: >-
          flutter test --no-pub --reporter expanded
          test/astrology_generation_coordinator_test.dart
          test/bazi_chart_model_test.dart
          test/bazi_compatibility_api_auth_test.dart
          test/bazi_compatibility_pdf_test.dart
          test/bazi_compatibility_report_test.dart
          test/bazi_provider_test.dart
          test/bazi_result_page_test.dart

      - uses: actions/upload-artifact@v4
        with:
          name: bazi-reader-v2-pdf
          path: build/bazi-reader-v2-pdf/knowme-bazi-reader-v2.pdf

      - name: Test full Flutter suite
        env:
          CI: 'true'
          FLUTTER_SUPPRESS_ANALYTICS: 'true'
          KNOWME_PDFTOPPM: /usr/bin/pdftoppm
          TZ: Asia/Bangkok
        run: flutter test --no-pub --reporter compact
